<h2>Estoque Central</h2>

<div class="estoque-container">

    <h3>Produtos</h3>
    <table id="tabelaEstoque">
        <thead>
            <tr>
                <th>Produto</th>
                <th>Central</th>
                <th>Consignado</th>
                <th>Produção</th>
                <th>Ajustar</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <div id="ajusteModal" class="modal hidden">
        <div class="modal-content">
            <h3>Ajustar Estoque</h3>

            <p id="produtoNome"></p>

            <label>Quantidade</label>
            <input type="number" id="ajusteQtd">

            <label>Tipo</label>
            <select id="ajusteTipo">
                <option value="entrada">Entrada</option>
                <option value="saida">Saída</option>
            </select>

            <label>Motivo</label>
            <input type="text" id="ajusteMotivo">

            <button id="confirmarAjuste">Confirmar</button>
            <button onclick="fecharModal()">Cancelar</button>
        </div>
    </div>

</div>

<script src="estoque.js"></script>
