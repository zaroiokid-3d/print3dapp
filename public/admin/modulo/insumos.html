<h2>Insumos</h2>

<div class="insumos-container">

    <h3>Cadastrar Novo Insumo</h3>

    <div class="form-bloco">
        <label>Nome</label>
        <input type="text" id="nome">

        <label>Categoria</label>
        <input type="text" id="categoria">

        <label>Unidade (g, ml, un...)</label>
        <input type="text" id="unidade">

        <button id="btnCadastrar">Cadastrar</button>
    </div>

    <h3>Lista de Insumos</h3>

    <table id="tabelaInsumos">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Categoria</th>
                <th>Quantidade</th>
                <th>Unidade</th>
                <th>Status</th>
                <th>Ajustar</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <!-- Modal de ajuste -->
    <div id="ajusteModal" class="modal hidden">
        <div class="modal-content">
            <h3>Ajustar Insumo</h3>

            <p id="insumoNome"></p>

            <label>Quantidade</label>
            <input type="number" id="ajusteQtd" step="0.01">

            <label>Tipo</label>
            <select id="ajusteTipo">
                <option value="entrada">Entrada</option>
                <option value="saida">Saída</option>
            </select>

            <label>Motivo</label>
            <input type="text" id="ajusteMotivo">

            <button id="confirmarAjuste">Confirmar</button>
            <button onclick="fecharModal()">Cancelar</button>
        </div>
    </div>

</div>

<script src="insumos.js"></script>
