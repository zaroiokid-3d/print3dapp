<h2>Vendedores</h2>

<div class="vendedores-container">

    <h3>Cadastrar Novo Vendedor</h3>

    <div class="form-bloco">
        <label>Nome</label>
        <input type="text" id="nome">

        <label>E-mail</label>
        <input type="email" id="email">

        <label>Senha</label>
        <input type="password" id="senha">

        <button id="btnCadastrar">Cadastrar</button>
    </div>

    <h3>Lista de Vendedores</h3>

    <table id="tabelaVendedores">
        <thead>
            <tr>
                <th>Nome</th>
                <th>E-mail</th>
                <th>Status</th>
                <th>Ação</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

</div>

<script src="vendedores.js"></script>
