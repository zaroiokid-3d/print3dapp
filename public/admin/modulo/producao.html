<h2>Produção</h2>

<div class="producao-container">

    <div class="form-bloco">
        <label>Produto</label>
        <select id="produtoSelect"></select>

        <label>Quantidade</label>
        <input type="number" id="quantidade" min="1">

        <button id="btnIniciar">Iniciar Produção</button>
    </div>

    <h3>Produções em andamento</h3>
    <table id="tabelaProducao">
        <thead>
            <tr>
                <th>Produto</th>
                <th>Qtd</th>
                <th>Status</th>
                <th>Início</th>
                <th>Ação</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

</div>

<script src="producao.js"></script>
