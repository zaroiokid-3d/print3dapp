<h2>Consignação</h2>

<div class="consignacao-container">

    <h3>Vendedores</h3>
    <select id="vendedorSelect"></select>

    <h3>Produtos</h3>
    <select id="produtoSelect"></select>

    <label>Quantidade</label>
    <input type="number" id="quantidade" min="1">

    <button id="btnEnviar">Enviar para Consignação</button>
    <button id="btnDevolver">Registrar Devolução</button>

    <h3>Estoque Consignado</h3>
    <table id="tabelaConsignado">
        <thead>
            <tr>
                <th>Produto</th>
                <th>Quantidade</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

</div>

<script src="consignacao.js"></script>
