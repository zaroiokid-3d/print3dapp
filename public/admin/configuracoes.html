<h2>Configurações do Sistema</h2>

<div class="config-container">

    <h3>Configurações Gerais</h3>

    <div class="form-bloco">
        <label>Percentual de Comissão (%)</label>
        <input type="number" id="percentualComissao" step="0.01">

        <label>Peso Padrão Consumido por Peça (g)</label>
        <input type="number" id="pesoPadrao" step="0.01">

        <label>Nome da Empresa</label>
        <input type="text" id="nomeEmpresa">

        <label>E-mail de Suporte</label>
        <input type="email" id="emailSuporte">

        <label>Tema do Dashboard</label>
        <select id="temaDashboard">
            <option value="claro">Claro</option>
            <option value="escuro">Escuro</option>
        </select>

        <button id="btnSalvar">Salvar Configurações</button>
    </div>

</div>

<script src="configuracoes.js"></script>
