<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>ZaroioKID 3D — Painel Admin</title>
    <link rel="stylesheet" href="dashboard.css">

    <!-- 1. Supabase global -->
<script type="module" src="../supabaseClient.js"></script>

<!-- 2. Proteção de acesso (depende do Supabase) -->
<script defer src="protect.js"></script>

</head>

<body>

<div class="layout">

    <aside class="sidebar">
        <h2>ZaroioKID 3D</h2>
        <nav>
            <ul>
                <li data-module="producao">Produção</li>
                <li data-module="estoque">Estoque Central</li>
                <li data-module="consignacao">Consignação</li>
                <li data-module="vendas">Vendas</li>
                <li data-module="vendedores">Vendedores</li>
                <li data-module="lojas">Lojas</li>
                <li data-module="catalogo">Catálogo</li>
                <li data-module="filamentos">Filamentos</li>
                <li data-module="insumos">Insumos</li>
                <li data-module="comissoes">Comissões</li>
                <li data-module="config">Configurações</li>
            </ul>
        </nav>
    </aside>

    <main class="content">
        <header class="topbar">
            <div class="topbar-left">
                <span id="topbar-username">Carregando...</span>
            </div>

            <div class="topbar-right">
                <div class="user-menu">
                    <img id="topbar-avatar" class="avatar" src="../assets/avatar-default.png" alt="avatar">

                    <div id="dropdown-menu" class="dropdown hidden">
                        <div class="dropdown-item" id="menu-perfil">Meu Perfil</div>
                        <div class="dropdown-item" id="menu-config">Configurações</div>
                        <div class="dropdown-divider"></div>
                        <div class="dropdown-item logout" id="menu-logout">Sair</div>
                    </div>
                </div>
            </div>
        </header>

        <h1 id="titulo-modulo">Selecione um módulo</h1>
        <div id="modulo-container" class="card"></div>
    </main>

</div>

<!-- LÓGICA DO DASHBOARD -->
<!-- 3. Dashboard (depende do DOM e do Supabase) -->
<script defer src="dashboard.js"></script>


</body>
</html>
