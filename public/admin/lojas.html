<h2>Lojas</h2>

<div class="lojas-container">

    <h3>Cadastrar Nova Loja</h3>

    <div class="form-bloco">
        <label>Nome da Loja</label>
        <input type="text" id="nomeLoja">

        <label>Endereço</label>
        <input type="text" id="enderecoLoja">

        <button id="btnCadastrarLoja">Cadastrar</button>
    </div>

    <h3>Lista de Lojas</h3>

    <table id="tabelaLojas">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Endereço</th>
                <th>Status</th>
                <th>Ação</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

</div>

<script src="lojas.js"></script>
